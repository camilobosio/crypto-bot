# Paper trading de futuros en los servidores de GitHub (gratis, sin tu compu).
# Cada 15 minutos procesa todas las velas de 5m nuevas desde la última corrida
# (aunque GitHub se atrase, el bot se pone al día sin saltear velas) y guarda el estado.
# Precios: espejo público de Binance, porque Bybit bloquea servidores de EE. UU.
name: paper-trading

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: paper
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recuperar velas guardadas
        uses: actions/cache@v4
        with:
          path: data
          key: velas-${{ github.run_id }}
          restore-keys: velas-
      - name: Procesar velas nuevas
        run: node scripts/paper.js --once
        env:
          DATA_SOURCE: binance
      - name: Guardar estado en el repo
        run: |
          git config user.name "crypto-bot"
          git config user.email "crypto-bot@users.noreply.github.com"
          git add state/ docs/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "paper: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
