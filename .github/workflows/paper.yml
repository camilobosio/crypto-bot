# Paper trading de futuros en los servidores de GitHub (gratis en repos públicos, sin tu compu).
#
# El horario programado de GitHub es poco confiable (puede atrasarse horas), así que cada
# corrida queda prendida ~5,5 h revisando el bot CADA MINUTO y, al terminar, lanza la siguiente.
# El cron de cada hora queda solo como respaldo si la cadena se corta.
# Precios: espejo público de Binance, porque Bybit bloquea servidores de EE. UU.
name: paper-trading

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recuperar velas guardadas
        uses: actions/cache@v4
        with:
          path: data
          key: velas-${{ github.run_id }}
          restore-keys: velas-
      - name: Bot (cada minuto; publica el panel cada 10 minutos)
        env:
          DATA_SOURCE: binance
        run: |
          git config user.name "crypto-bot"
          git config user.email "crypto-bot@users.noreply.github.com"
          publish() {
            git add state/ docs/
            if git diff --cached --quiet; then return 0; fi
            git commit -q -m "paper: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull -q --rebase -X ours || { git rebase --abort; return 0; }
            git push -q || true
          }
          END=$((SECONDS + 320*60))
          n=0
          while [ $SECONDS -lt $END ]; do
            node scripts/paper.js --once || echo "ciclo con error, sigo"
            n=$((n+1))
            if [ $((n % 10)) -eq 0 ]; then publish; fi
            sleep 60
          done
          publish
      - name: Lanzar la siguiente corrida
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run paper.yml --ref main
