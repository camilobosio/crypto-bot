# Bot de futuros (PAPER) en los servidores de GitHub, 24/7, sin tu compu.
# Revisa cada minuto. El estado y los datos del panel viven en la rama "futures-data"
# (se actualiza cada minuto sin reconstruir la página). Cada corrida dura ~5,5 h y lanza la siguiente.
# Precios: espejo público de Binance, porque Bybit bloquea servidores de EE. UU.
name: paper-trading

on:
  schedule:
    - cron: '7 * * * *'   # respaldo por si la cadena se corta
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recuperar velas guardadas
        uses: actions/cache@v4
        with:
          path: data
          key: velas-${{ github.run_id }}
          restore-keys: velas-
      - name: Traer el estado del bot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir fx-data && cd fx-data
          git init -q
          git config user.name "crypto-bot"
          git config user.email "crypto-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin futures-data; then git checkout -q -b futures-data FETCH_HEAD
          else git checkout -q --orphan futures-data; cp ../state/* . 2>/dev/null || true; fi
      - name: Bot de futuros (cada minuto)
        env:
          DATA_SOURCE: binance
          STATE_DIR: fx-data
          GH_TOKEN: ${{ github.token }}
          AVISAR_A: maugeperfumerie
        run: |
          LOG=fx-data/paper_mtfBreakout.log
          count() { grep -cE 'APERTURA|CIERRE|EVENTO' "$LOG" 2>/dev/null || echo 0; }
          notify() {
            ISSUE=$(gh issue list --label operaciones --state open --json number -q '.[0].number' 2>/dev/null)
            if [ -z "$ISSUE" ]; then
              gh label create operaciones --color 2563eb --force >/dev/null 2>&1
              ISSUE=$(gh issue create --label operaciones --title "📈 Operaciones del bot de futuros (paper)" \
                --body "Cada vez que el bot abre o cierra una operación aparece un comentario acá. Panel: https://camilobosio.com/crypto-bot/" | grep -oE '[0-9]+$')
            fi
            printf '@%s\n\n```\n%s\n```\n\nPanel: https://camilobosio.com/crypto-bot/\n' "$AVISAR_A" "$1" > /tmp/aviso.md
            gh issue comment "$ISSUE" --body-file /tmp/aviso.md >/dev/null || true
          }
          sync() {
            ( cd fx-data && git add -A && \
              if git rev-parse -q --verify HEAD >/dev/null; then git commit -q --amend --allow-empty -m "datos bot de futuros"; else git commit -q -m "datos bot de futuros"; fi && \
              git push -q -f origin HEAD:futures-data ) || echo "sync falló, sigo"
          }
          END=$((SECONDS + 320*60))
          last=$(count)
          while [ $SECONDS -lt $END ]; do
            node scripts/paper.js --once || echo "ciclo con error, sigo"
            sync
            c=$(count)
            if [ "$c" -gt "$last" ]; then
              notify "$(grep -E 'APERTURA|CIERRE|EVENTO' "$LOG" | tail -n $((c - last)))"
              last=$c
            fi
            sleep 50
          done
      - name: Lanzar la siguiente corrida
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run paper.yml --ref main
